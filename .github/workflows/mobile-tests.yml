# Espelho do pipeline GitLab para quando o repositório estiver hospedado no GitHub.
# Os runners do GitHub têm KVM, então o emulador Android roda direto aqui.
name: Testes mobile

on:
  push:
  pull_request:

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_RELEASE: v2.2.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - name: Baixar o app (release oficial)
        run: |
          mkdir -p apps
          curl -fsSL -o apps/android.wdio.native.app.apk \
            "https://github.com/webdriverio/native-demo-app/releases/download/${APP_RELEASE}/android.wdio.native.app.${APP_RELEASE}.apk"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Executar a suíte no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: npm run test:android

      - name: Gerar Allure Report
        if: always()
        run: npm run report:generate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: reports/allure-report/
          retention-days: 15
